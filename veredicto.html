<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Veredicto Final 2026 | Jóvenes que Inspiran</title>
<link rel="icon" href="https://i.ibb.co/sdJt3zGq/logo-cmj-sin-fondo.png">
<meta name="description" content="Veredicto final de los premios Jóvenes que Inspiran 2026. Quinta Gala de la Juventud de Villa Rica, Cauca.">
<meta name="theme-color" content="#0b0b0d">
<meta property="og:type" content="website">
<meta property="og:title" content="Veredicto Final 2026 | Jóvenes que Inspiran">
<meta property="og:description" content="Conoce a los ganadores y cómo se llegó a cada resultado.">
<meta property="og:image" content="https://i.ibb.co/sdJt3zGq/logo-cmj-sin-fondo.png">
<style>
  :root {
    --negro: #0b0b0d; --negro2: #16161a; --negro3: #1f1f25;
    --amarillo: #ffc400; --verde: #1fb26b; --rojo: #e53935;
    --texto: #f3f3f5; --suave: #a2a2ae; --borde: #2c2c34;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: var(--negro); color: var(--texto); min-height: 100vh; }
  header { position: relative; text-align: center; padding: 20px 16px 32px; background: radial-gradient(1200px 300px at 50% -10%, rgba(255,196,0,.22), transparent 70%), var(--negro2); border-bottom: 4px solid var(--amarillo); }
  header::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: linear-gradient(90deg, var(--amarillo) 0 34%, var(--verde) 34% 67%, var(--rojo) 67% 100%); }
  #logos { display: flex; justify-content: center; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 8px; }
  #logos img { height: 70px; max-width: 200px; object-fit: contain; }
  h1 { margin: 4px 0 6px; font-size: clamp(22px, 5vw, 38px); color: var(--amarillo); text-transform: uppercase; letter-spacing: .5px; }
  header p { margin: 0; font-size: clamp(12px, 2.6vw, 16px); letter-spacing: 1.2px; opacity: .9; }
  #demo { display: none; background: var(--rojo); color: #fff; text-align: center; font-weight: 700; padding: 8px; font-size: 14px; }
  main { max-width: 1060px; margin: 0 auto; padding: 22px 14px 130px; }
  .card { background: var(--negro2); border: 1px solid var(--borde); border-radius: 18px; padding: 20px; box-shadow: 0 6px 24px rgba(0,0,0,.35); }
  .centro { text-align: center; }
  .btn { display: inline-block; border: 0; border-radius: 12px; padding: 13px 20px; font-size: 16px; font-weight: 700; background: var(--amarillo); color: #000; cursor: pointer; font-family: inherit; }
  .btn:hover { filter: brightness(1.08); }
  .btn:disabled { background: var(--negro3); color: var(--suave); cursor: not-allowed; filter: none; }
  .btn.sec { background: transparent; color: var(--amarillo); border: 1px solid var(--amarillo); }
  .btn.grande { font-size: 20px; padding: 16px 30px; }
  .btn.verde { background: var(--verde); color: #fff; }

  .bienvenida h2 { font-size: clamp(24px, 5vw, 36px); margin: 8px 0 10px; }
  .bienvenida p { color: var(--suave); margin: 0 0 18px; line-height: 1.5; }
  .pesos { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 0 0 24px; }
  .peso { background: var(--negro3); border-radius: 14px; padding: 12px 16px; min-width: 140px; }
  .peso b { display: block; font-size: 28px; color: var(--amarillo); }
  .peso span { font-size: 13px; color: var(--suave); }
  .acciones { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

  .cab { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin: 0 4px 14px; }
  .cab .num { color: var(--suave); font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }
  .cab h2 { margin: 4px 0 0; font-size: clamp(22px, 4.6vw, 32px); border-left: 6px solid var(--amarillo); padding-left: 12px; width: 100%; }
  .nota { color: var(--suave); font-size: 14px; margin: 0 4px 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  .nom { background: var(--negro2); border: 1px solid var(--borde); border-radius: 18px; overflow: hidden; animation: subir .5s ease backwards; }
  .foto { aspect-ratio: 1 / 1; background: var(--negro3); display: flex; align-items: center; justify-content: center; font-size: 64px; font-weight: 800; color: var(--amarillo); }
  .foto img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .nom .info { padding: 12px 14px 16px; }
  .nom h3 { margin: 0 0 6px; font-size: 18px; line-height: 1.25; }
  .votos { color: var(--suave); font-size: 14px; }
  .votos strong { font-size: 28px; color: var(--texto); }
  @keyframes subir { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  .hero { text-align: center; padding: 26px 16px 30px; border: 2px solid var(--amarillo); border-radius: 22px; background: radial-gradient(600px 240px at 50% 0%, rgba(255,196,0,.2), transparent 70%), var(--negro2); margin-bottom: 22px; animation: aparece .8s ease; }
  @keyframes aparece { from { opacity: 0; transform: scale(.9); } to { opacity: 1; transform: none; } }
  .hero .etiqueta { color: var(--amarillo); font-weight: 800; letter-spacing: 3px; text-transform: uppercase; font-size: 14px; margin-top: 6px; }
  .ganadores { display: flex; justify-content: center; gap: 28px; flex-wrap: wrap; margin-top: 14px; }
  .gan { max-width: 300px; }
  .gan .foto { width: min(240px, 60vw); border-radius: 50%; border: 5px solid var(--amarillo); margin: 0 auto 14px; overflow: hidden; box-shadow: 0 0 40px rgba(255,196,0,.35); }
  .gan h3 { margin: 0 0 6px; font-size: clamp(24px, 5vw, 38px); }
  .gan .tot { color: var(--verde); font-size: 22px; font-weight: 800; }
  .empate { color: var(--rojo); font-weight: 700; margin-top: 10px; }

  .tit2 { margin: 6px 4px 12px; font-size: 18px; color: var(--suave); }
  .desg { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
  .dcard { background: var(--negro2); border: 1px solid var(--borde); border-radius: 18px; padding: 16px; animation: subir .5s ease backwards; }
  .dcard.top { border-color: var(--amarillo); box-shadow: 0 0 0 1px rgba(255,196,0,.35); }
  .dhead { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .dhead .mini { width: 58px; height: 58px; border-radius: 50%; overflow: hidden; flex: none; background: var(--negro3); display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 800; color: var(--amarillo); }
  .dhead .mini img { width: 100%; height: 100%; object-fit: cover; }
  .dhead h4 { margin: 0; font-size: 16px; line-height: 1.25; flex: 1; }
  .pos { flex: none; background: var(--negro3); border-radius: 999px; padding: 4px 10px; font-weight: 800; font-size: 13px; }
  .dcard.top .pos { background: var(--amarillo); color: #000; }
  .crit { margin-bottom: 11px; }
  .crit .fila { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--suave); }
  .crit .fila b { color: var(--texto); font-size: 14px; white-space: nowrap; }
  .crit .det { font-size: 12px; color: var(--suave); margin: 2px 0 5px; }
  .barra { height: 8px; border-radius: 6px; background: var(--negro3); overflow: hidden; }
  .barra div { height: 100%; width: 0; border-radius: 6px; transition: width 1.1s cubic-bezier(.2,.8,.2,1); }
  .c1 div { background: var(--amarillo); } .c2 div { background: var(--verde); } .c3 div { background: var(--rojo); }
  .total { display: flex; justify-content: space-between; align-items: baseline; border-top: 1px solid var(--borde); padding-top: 10px; margin-top: 4px; }
  .total span { color: var(--suave); font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }
  .total b { font-size: 26px; color: var(--amarillo); }
  .incompleto { color: var(--rojo); font-size: 13px; font-weight: 700; }

  .ganfinal { text-align: center; }
  .ganfinal .cat { font-size: 12px; color: var(--amarillo); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; min-height: 30px; }

  #barra { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: rgba(11,11,13,.94); backdrop-filter: blur(6px); border-top: 1px solid var(--borde); padding: 12px 14px; display: none; gap: 10px; justify-content: center; align-items: center; flex-wrap: wrap; }
  #barra.on { display: flex; }
  #barra select { background: var(--negro2); color: var(--texto); border: 1px solid var(--borde); border-radius: 10px; padding: 12px; font-size: 14px; max-width: 260px; font-family: inherit; }
  #cuenta { position: fixed; inset: 0; background: rgba(0,0,0,.92); display: none; align-items: center; justify-content: center; flex-direction: column; z-index: 90; }
  #cuenta.on { display: flex; }
  #cuenta small { color: var(--amarillo); letter-spacing: 4px; text-transform: uppercase; font-size: 16px; margin-bottom: 8px; }
  #cuenta b { font-size: min(42vw, 300px); color: var(--amarillo); line-height: 1; animation: pop .9s ease; }
  @keyframes pop { 0% { transform: scale(.4); opacity: 0; } 30% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(1); opacity: .9; } }
  #confeti { position: fixed; inset: 0; pointer-events: none; z-index: 95; }
  #toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: var(--rojo); color: #fff; padding: 12px 18px; border-radius: 12px; font-size: 14px; display: none; z-index: 100; max-width: 90%; text-align: center; }
  #toast.on { display: block; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  @media (max-width: 640px) {
    #logos img { height: 56px; } main { padding-top: 16px; padding-bottom: 150px; } .btn.grande { font-size: 18px; padding: 14px 22px; }
    .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .nom .info { padding: 10px; } .nom h3 { font-size: 15px; } .votos strong { font-size: 22px; } .foto { font-size: 48px; }
    .ganfinal .cat { font-size: 11px; min-height: 28px; }
    #barra { padding: 8px 10px; gap: 8px; }
    #barra .btn { padding: 11px 14px; font-size: 14px; }
    #barra select { flex: 1 1 100%; max-width: none; padding: 10px; order: -1; }
    .peso { min-width: 100px; padding: 10px 12px; } .peso b { font-size: 22px; }
  }
</style>
</head>
<body>
<header>
  <div id="logos"></div>
  <h1>Veredicto Final 2026</h1>
  <p>Premios Jóvenes que Inspiran · Quinta Edición de la Gala de la Juventud</p>
</header>
<div id="demo">MODO DEMOSTRACIÓN: datos de ejemplo, no son resultados reales</div>
<main id="pantalla"></main>

<div id="barra">
  <button class="btn sec" id="bAnt">Anterior</button>
  <select id="bSel" aria-label="Ir a categoría"></select>
  <button class="btn" id="bPrin"></button>
  <button class="btn sec" id="bFull">Pantalla completa</button>
</div>
<div id="cuenta"><small>El ganador es...</small><b id="cuentaNum">3</b></div>
<canvas id="confeti"></canvas>
<div id="toast"></div>

<script>
/* ================= CONFIGURACIÓN ================= */
const URL_API = 'https://script.google.com/macros/s/AKfycbwt8LvtsU8QxynxEC0OIWrGjoUwY5F3_GVvAvwHPNRFVWpDDbCzuWS6jl0vIb-9LH_ejw/exec';
const LOGO_RESPALDO = 'https://i.ibb.co/sdJt3zGq/logo-cmj-sin-fondo.png';
/* ================================================== */

const DEMO = new URLSearchParams(location.search).has('demo');
const $ = id => document.getElementById(id);
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
function fmt(v) { return (v === null || v === undefined) ? '-' : Number(v).toLocaleString('es-CO', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function ent(v) { return (v === null || v === undefined) ? '-' : Number(v).toLocaleString('es-CO', { maximumFractionDigits: 0 }); }
function inicial(n) { return (n || '?').trim().charAt(0).toUpperCase(); }
const dormir = ms => new Promise(r => setTimeout(r, ms));
function aviso(msg) { const t = $('toast'); t.textContent = msg; t.className = 'on'; clearTimeout(aviso.h); aviso.h = setTimeout(() => { t.className = ''; }, 4000); }

let cats = [], iCat = 0, etapa = 'votos', modo = 'carga', ocupado = false, logos = [];

/* ---------- Datos de demostración ---------- */
function datosDemo() {
  const defs = [
    ['Emprendedor Juvenil del Año', [['Ejemplo Uno', 120, [60, 25, 10], [8, 8, 6]], ['Ejemplo Dos', 95, [90, 40, 22], [10, 8, 8]], ['Ejemplo Tres', 60, [30, 12, 5], [6, 6, 6]]]],
    ['Deportista Destacado', [['Ejemplo Cuatro', 80, [45, 20, 8], [8, 10, 8]], ['Ejemplo Cinco', 82, [38, 15, 6], [8, 8, 10]]]],
    ['Creador de Contenido', [['Ejemplo Seis', 140, [200, 60, 30], [10, 10, 8]]]],
    ['Grupo Juvenil Destacado', [['Ejemplo Siete', 70, [50, 18, 9], [8, 8, 8]], ['Ejemplo Ocho', 100, [40, 22, 12], [6, 8, 8]], ['Ejemplo Nueve', 55, [80, 30, 15], [10, 8, 10]]]]
  ];
  const lista = []; let id = 1;
  defs.forEach(([cat, noms]) => {
    const maxV = Math.max(...noms.map(n => n[1]));
    const tots = noms.map(n => n[2][0] + n[2][1] + n[2][2]);
    const maxI = Math.max(...tots);
    noms.forEach((n, i) => {
      const [nombre, votos, [r, c, s], [a, b, d]] = n;
      const pV = votos / maxV * 60, pI = tots[i] / maxI * 30, pVid = (a + b + d) / 3;
      lista.push({ id: 'd' + (id++), categoria: cat, nombre: nombre, foto: '', votos: votos, pVotos: pV, pInter: pI, pVideo: pVid,
        total: pV + pI + pVid, fb: { reacciones: r, comentarios: c, compartidos: s, total: tots[i] } });
    });
  });
  return { ok: true, nominados: lista, logos: [LOGO_RESPALDO] };
}

/* ---------- Preparación ---------- */
function preparar(lista) {
  const mapa = new Map();
  lista.forEach(n => { if (!mapa.has(n.categoria)) mapa.set(n.categoria, []); mapa.get(n.categoria).push(n); });
  return Array.from(mapa, ([nombre, noms]) => {
    const completo = noms.every(n => n.total !== null && n.total !== undefined);
    const orden = noms.slice();
    if (completo) orden.sort((a, b) => b.total - a.total);
    const max = completo ? Math.max(...noms.map(n => n.total)) : null;
    const ganadores = completo ? noms.filter(n => Math.abs(n.total - max) < 1e-9) : [];
    return { nombre: nombre, noms: noms, orden: orden, completo: completo, ganadores: ganadores };
  });
}

/* ---------- Piezas visuales ---------- */
function foto(n, cls) {
  const f = el('div', cls || 'foto');
  if (n.foto) {
    const img = new Image(); img.alt = n.nombre; img.referrerPolicy = 'no-referrer';
    img.onerror = () => { img.remove(); f.textContent = inicial(n.nombre); };
    img.src = n.foto; f.appendChild(img);
  } else f.textContent = inicial(n.nombre);
  return f;
}
function criterio(clase, titulo, valor, maximo, detalle) {
  const c = el('div', 'crit');
  const fila = el('div', 'fila');
  fila.appendChild(el('span', '', titulo));
  fila.appendChild(el('b', '', valor === null ? '-' : fmt(valor) + ' / ' + maximo));
  c.appendChild(fila);
  if (detalle) c.appendChild(el('div', 'det', detalle));
  const barra = el('div', 'barra ' + clase); const rel = el('div'); barra.appendChild(rel); c.appendChild(barra);
  rel.dataset.ancho = valor === null ? 0 : Math.max(0, Math.min(100, valor * 100 / maximo));
  return c;
}
function tarjetaDesglose(n, pos, top, retraso) {
  const d = el('article', 'dcard' + (top ? ' top' : ''));
  d.style.animationDelay = retraso + 'ms';
  const h = el('div', 'dhead');
  h.appendChild(foto(n, 'mini'));
  h.appendChild(el('h4', '', n.nombre));
  if (pos) h.appendChild(el('span', 'pos', pos + '.º'));
  d.appendChild(h);
  d.appendChild(criterio('c1', 'Votación de la comunidad (60%)', n.pVotos, 60, ent(n.votos) + (n.votos === 1 ? ' voto válido' : ' votos válidos')));
  const fb = n.fb;
  const detFb = fb ? ent(fb.reacciones) + ' reacciones + ' + ent(fb.comentarios) + ' comentarios + ' + ent(fb.compartidos) + ' compartidos = ' + ent(fb.total) : '';
  d.appendChild(criterio('c2', 'Interacción en Facebook (30%)', n.pInter, 30, detFb));
  d.appendChild(criterio('c3', 'Evaluación del video (10%)', n.pVideo, 10, 'Promedio de los evaluadores'));
  const t = el('div', 'total');
  t.appendChild(el('span', '', 'Total'));
  t.appendChild(el('b', '', n.total === null ? 'Incompleto' : fmt(n.total) + ' / 100'));
  d.appendChild(t);
  return d;
}
function animarBarras() {
  requestAnimationFrame(() => requestAnimationFrame(() => {
    document.querySelectorAll('.barra div[data-ancho]').forEach(b => { b.style.width = b.dataset.ancho + '%'; });
  }));
}
function desglose(cat, conPodio) {
  const cont = el('div');
  cont.appendChild(el('h3', 'tit2', 'Así se llegó al resultado'));
  const g = el('div', 'desg');
  cat.orden.forEach((n, i) => {
    const pos = cat.completo ? 1 + cat.orden.filter(o => o.total > n.total + 1e-9).length : null;
    g.appendChild(tarjetaDesglose(n, pos, cat.completo && cat.ganadores.indexOf(n) >= 0, i * 120));
  });
  cont.appendChild(g);
  if (!cat.completo) cont.appendChild(el('p', 'incompleto', 'Esta categoría aún tiene datos incompletos.'));
  return cont;
}

/* ---------- Pantallas ---------- */
function pantallaCarga(msg, reintento) {
  modo = 'carga'; $('barra').className = '';
  const p = $('pantalla'); p.textContent = '';
  const c = el('section', 'card centro'); c.appendChild(el('p', '', msg));
  if (reintento) { const b = el('button', 'btn', 'Reintentar'); b.onclick = cargar; c.appendChild(b); }
  p.appendChild(c);
}
function pantallaBienvenida() {
  modo = 'bienvenida'; $('barra').className = '';
  const p = $('pantalla'); p.textContent = '';
  const c = el('section', 'card centro bienvenida');
  c.appendChild(el('h2', '', 'Ceremonia de veredicto'));
  c.appendChild(el('p', '', cats.length + ' categorías. El puntaje final combina tres criterios, y al final de cada categoría se muestra cómo se llegó al resultado.'));
  const pesos = el('div', 'pesos');
  [['60%', 'Votación de la comunidad'], ['30%', 'Interacción en Facebook'], ['10%', 'Evaluación del video']].forEach(([a, b]) => {
    const x = el('div', 'peso'); x.appendChild(el('b', '', a)); x.appendChild(el('span', '', b)); pesos.appendChild(x);
  });
  c.appendChild(pesos);
  const ac = el('div', 'acciones');
  const b1 = el('button', 'btn grande', 'Comenzar ceremonia'); b1.onclick = () => { iCat = 0; etapa = 'votos'; pantallaCategoria(); entrarPantallaCompleta(); };
  const b2 = el('button', 'btn sec', 'Ver resultados completos'); b2.onclick = pantallaExplorar;
  ac.appendChild(b1); ac.appendChild(b2); c.appendChild(ac);
  p.appendChild(c);
  window.scrollTo(0, 0);
}
function pantallaCategoria() {
  modo = 'categoria';
  const cat = cats[iCat];
  const p = $('pantalla'); p.textContent = '';
  const cab = el('div', 'cab');
  cab.appendChild(el('span', 'num', 'Categoría ' + (iCat + 1) + ' de ' + cats.length));
  cab.appendChild(el('h2', '', cat.nombre));
  p.appendChild(cab);
  if (etapa === 'votos') {
    p.appendChild(el('p', 'nota', 'Votos recibidos de la comunidad. Los demás criterios se muestran después de revelar al ganador.'));
    const g = el('div', 'grid');
    cat.noms.forEach((n, i) => {
      const card = el('article', 'nom'); card.style.animationDelay = (i * 90) + 'ms';
      card.appendChild(foto(n));
      const info = el('div', 'info'); info.appendChild(el('h3', '', n.nombre));
      const v = el('div', 'votos'); v.appendChild(el('strong', '', ent(n.votos))); v.appendChild(document.createTextNode(n.votos === 1 ? ' voto' : ' votos'));
      info.appendChild(v); card.appendChild(info); g.appendChild(card);
    });
    p.appendChild(g);
  } else {
    const hero = el('section', 'hero');
    hero.innerHTML = '<svg viewBox="0 0 64 48" width="64" height="48" aria-hidden="true"><path d="M4 40 L10 12 L22 26 L32 6 L42 26 L54 12 L60 40 Z" fill="#ffc400"/><rect x="4" y="42" width="56" height="5" rx="2" fill="#ffc400"/></svg>';
    hero.appendChild(el('div', 'etiqueta', cat.ganadores.length > 1 ? 'Ganadores de la categoría' : 'Ganador de la categoría'));
    const gs = el('div', 'ganadores');
    cat.ganadores.forEach(n => {
      const g = el('div', 'gan'); g.appendChild(foto(n)); g.appendChild(el('h3', '', n.nombre));
      g.appendChild(el('div', 'tot', fmt(n.total) + ' puntos de 100')); gs.appendChild(g);
    });
    hero.appendChild(gs);
    if (cat.ganadores.length > 1) hero.appendChild(el('div', 'empate', 'Empate en el primer lugar. Se define según el reglamento.'));
    p.appendChild(hero);
    p.appendChild(desglose(cat));
    animarBarras();
  }
  actualizarBarra();
  window.scrollTo(0, 0);
}
function pantallaFinal() {
  modo = 'final'; etapa = 'votos';
  const p = $('pantalla'); p.textContent = '';
  const cab = el('div', 'cab'); cab.appendChild(el('span', 'num', 'Ceremonia completada')); cab.appendChild(el('h2', '', 'Ganadores 2026')); p.appendChild(cab);
  const g = el('div', 'grid');
  cats.forEach((c, i) => {
    c.ganadores.forEach(n => {
      const card = el('article', 'nom ganfinal'); card.style.animationDelay = (i * 80) + 'ms';
      card.appendChild(foto(n));
      const info = el('div', 'info'); info.appendChild(el('div', 'cat', c.nombre)); info.appendChild(el('h3', '', n.nombre));
      info.appendChild(el('div', 'votos', fmt(n.total) + ' / 100')); card.appendChild(info); g.appendChild(card);
    });
  });
  p.appendChild(g);
  const ac = el('div', 'acciones'); ac.style.marginTop = '22px';
  const b1 = el('button', 'btn', 'Ver resultados completos'); b1.onclick = pantallaExplorar;
  const b2 = el('button', 'btn sec', 'Volver al inicio'); b2.onclick = pantallaBienvenida;
  ac.appendChild(b1); ac.appendChild(b2); p.appendChild(ac);
  actualizarBarra(); lanzarConfeti();
  window.scrollTo(0, 0);
}
function pantallaExplorar() {
  modo = 'explorar'; $('barra').className = '';
  salirPantallaCompleta();
  const p = $('pantalla'); p.textContent = '';
  const cab = el('div', 'cab'); cab.appendChild(el('span', 'num', 'Resultados completos')); cab.appendChild(el('h2', '', 'Veredicto Final 2026')); p.appendChild(cab);
  const ac = el('div', 'acciones'); ac.style.justifyContent = 'flex-start'; ac.style.margin = '0 4px 18px';
  const sel = el('select'); sel.style.cssText = 'background:#16161a;color:#f3f3f5;border:1px solid #2c2c34;border-radius:10px;padding:12px;font-size:14px;max-width:100%';
  const o0 = el('option', '', 'Ir a categoría...'); o0.value = ''; sel.appendChild(o0);
  cats.forEach((c, i) => { const o = el('option', '', c.nombre); o.value = 'cat' + i; sel.appendChild(o); });
  sel.onchange = () => { if (sel.value) $(sel.value).scrollIntoView({ behavior: 'smooth' }); };
  const volver = el('button', 'btn sec', 'Volver al inicio'); volver.onclick = pantallaBienvenida;
  ac.appendChild(sel); ac.appendChild(volver); p.appendChild(ac);
  cats.forEach((c, i) => {
    const s = el('section'); s.id = 'cat' + i; s.style.marginBottom = '34px';
    const h = el('div', 'cab'); h.appendChild(el('h2', '', c.nombre)); s.appendChild(h);
    if (c.completo) {
      const w = el('p', 'nota', (c.ganadores.length > 1 ? 'Ganadores: ' : 'Ganador: ') + c.ganadores.map(n => n.nombre).join(' y '));
      w.style.color = '#ffc400'; w.style.fontWeight = '700'; s.appendChild(w);
    }
    s.appendChild(desglose(c)); p.appendChild(s);
  });
  animarBarras();
  window.scrollTo(0, 0);
}

/* ---------- Barra de control ---------- */
function actualizarBarra() {
  const b = $('barra');
  if (modo !== 'categoria' && modo !== 'final') { b.className = ''; return; }
  b.className = 'on';
  const sel = $('bSel'); sel.textContent = '';
  cats.forEach((c, i) => { const o = el('option', '', (i + 1) + '. ' + c.nombre); o.value = i; sel.appendChild(o); });
  sel.value = modo === 'final' ? '' : iCat;
  sel.style.display = modo === 'final' ? 'none' : '';
  $('bAnt').style.display = (modo === 'categoria' && iCat === 0 && etapa === 'votos') ? 'none' : '';
  const prin = $('bPrin');
  prin.disabled = false; prin.className = 'btn';
  if (modo === 'final') { prin.textContent = 'Volver al inicio'; }
  else if (etapa === 'votos') { prin.textContent = 'Revelar ganador'; prin.className = 'btn verde'; prin.disabled = !cats[iCat].completo; }
  else { prin.textContent = iCat === cats.length - 1 ? 'Ver todos los ganadores' : 'Siguiente categoría'; }
}
async function accionPrincipal() {
  if (ocupado) return;
  if (modo === 'final') return pantallaBienvenida();
  if (modo !== 'categoria') return;
  if (etapa === 'votos') {
    if (!cats[iCat].completo) return aviso('Faltan datos en esta categoría. Revisa el Excel.');
    ocupado = true;
    const ov = $('cuenta'); ov.className = 'on';
    for (const k of [3, 2, 1]) { const n = $('cuentaNum'); n.textContent = k; n.style.animation = 'none'; void n.offsetWidth; n.style.animation = ''; await dormir(950); }
    ov.className = '';
    etapa = 'revelado'; pantallaCategoria(); lanzarConfeti(); ocupado = false;
  } else if (iCat < cats.length - 1) { iCat++; etapa = 'votos'; pantallaCategoria(); }
  else pantallaFinal();
}
function anterior() {
  if (ocupado || modo !== 'categoria') return;
  if (etapa === 'revelado') { etapa = 'votos'; pantallaCategoria(); }
  else if (iCat > 0) { iCat--; etapa = 'votos'; pantallaCategoria(); }
}
$('bPrin').onclick = accionPrincipal;
$('bAnt').onclick = anterior;
$('bSel').onchange = e => { if (ocupado || e.target.value === '') return; iCat = Number(e.target.value); etapa = 'votos'; modo = 'categoria'; pantallaCategoria(); };
$('bFull').onclick = () => { if (document.fullscreenElement) salirPantallaCompleta(); else entrarPantallaCompleta(); };
function entrarPantallaCompleta() { try { if (!document.fullscreenElement && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen(); } catch (e) {} }
function salirPantallaCompleta() { try { if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen(); } catch (e) {} }
document.addEventListener('keydown', e => {
  const t = e.target.tagName;
  if (t === 'SELECT' || t === 'BUTTON' || t === 'INPUT') return;
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter') { e.preventDefault(); accionPrincipal(); }
  else if (e.key === 'ArrowLeft') anterior();
  else if (e.key === 'f' || e.key === 'F') $('bFull').click();
});

/* ---------- Confeti ---------- */
function lanzarConfeti() {
  const c = $('confeti'), g = c.getContext('2d');
  c.width = innerWidth; c.height = innerHeight;
  const col = ['#ffc400', '#1fb26b', '#e53935', '#ffffff'];
  const ps = [];
  for (let i = 0; i < 220; i++) {
    const izq = i % 2 === 0;
    ps.push({ x: izq ? 0 : c.width, y: c.height * .6, vx: (izq ? 1 : -1) * (4 + Math.random() * 12), vy: -Math.random() * 20 - 6, s: 6 + Math.random() * 7, col: col[i % 4], r: Math.random() * 6 });
  }
  let n = 0;
  (function paso() {
    g.clearRect(0, 0, c.width, c.height);
    ps.forEach(p => { p.vy += .45; p.vx *= .995; p.x += p.vx; p.y += p.vy; p.r += .2; g.save(); g.translate(p.x, p.y); g.rotate(p.r); g.fillStyle = p.col; g.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * .6); g.restore(); });
    if (++n < 190) requestAnimationFrame(paso); else g.clearRect(0, 0, c.width, c.height);
  })();
}

/* ---------- Carga ---------- */
function pintarLogos() {
  const cont = $('logos'); cont.textContent = '';
  (logos.length ? logos : [LOGO_RESPALDO]).forEach(u => {
    const img = new Image(); img.alt = 'Logo'; img.referrerPolicy = 'no-referrer'; img.onerror = () => img.remove(); img.src = u; cont.appendChild(img);
  });
}
async function cargar() {
  pantallaCarga('Cargando veredicto...');
  try {
    let d;
    if (DEMO) { $('demo').style.display = 'block'; d = datosDemo(); }
    else {
      const r = await fetch(URL_API + '?accion=veredicto&t=' + Date.now());
      d = await r.json();
    }
    if (!d || !d.ok) {
      if (d && d.logos) { logos = d.logos; pintarLogos(); }
      return pantallaCarga((d && d.msg) || 'El veredicto aún no está disponible.', true);
    }
    logos = d.logos || []; pintarLogos();
    cats = preparar(d.nominados || []);
    if (!cats.length) return pantallaCarga('Todavía no hay resultados para mostrar.', true);
    pantallaBienvenida();
  } catch (e) {
    pantallaCarga('No se pudo cargar el veredicto. Revisa tu conexión.', true);
  }
}
pintarLogos();
cargar();
</script>
